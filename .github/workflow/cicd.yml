name: CI/CD Pipeline

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    name: Deploy to EC2 via Ansible
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install Ansible
      run: |
        python -m pip install --upgrade pip
        pip install ansible

    - name: Run Ansible Playbook
      uses: dawidd6/action-ansible-playbook@v2
      with:
        playbook: ansible-project/deploy.yml
        inventory: |
          [all]
          ${{ secrets.EC2_HOST }} ansible_user=${{ secrets.EC2_USER }} ansible_ssh_private_key=${{ secrets.SSH_KEY }}
