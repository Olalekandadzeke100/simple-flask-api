---
- name: Configure EC2 for App Deployment
  hosts: all
  become: yes

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install Docker, Docker Compose, Python, pip, Git
      apt:
        name:
          - docker.io
          - docker-compose
          - python3
          - python3-pip
          - git
        state: present

    - name: Enable and start Docker
      systemd:
        name: docker
        enabled: yes
        state: started

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Create app directory
      file:
        path: /home/owahab/myapp/
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Clone the Flask app repository
      git:
        repo: https://github.com/Olalekandadzeke100/simple-flask-api.git
        dest: /home/owahab/myapp/
        force: yes

          #    - name: Build Docker image
          #      shell: docker build -t flask-login-app /home/owahab/myapp/

    - name: Stop and remove existing container (if running)
      shell: |
        docker stop flask-app || true
        docker rm flask-app || true

        #    - name: Run the new container
        #      shell: |
        #        docker run -d --name flask-app -p 5000:5000 flask-login-app
